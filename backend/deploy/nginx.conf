# SAN HYDRO backend — nginx (reverse proxy + media/static)
# /etc/nginx/sites-available/sanhydro-backend  ga qo'ying, so'ng sites-enabled'ga link qiling.
# DOMENNI o'zingiznikiga almashtiring: api.san-hydro.uz

server {
    listen 80;
    server_name api.san-hydro.uz;

    client_max_body_size 20M;   # rasm yuklash (backend 15M gacha ruxsat beradi)

    # Yuklangan rasmlar — to'g'ridan-to'g'ri diskdan
    location /media/ {
        alias /opt/sanhydro/backend/media/;
        expires 7d;
        access_log off;
    }

    # Django admin static
    location /static/ {
        alias /opt/sanhydro/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Qolgan hammasi → gunicorn
    location / {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
